name: Documentation Check

on:
push:
branches:
- main

jobs:
documentation-check:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Check README exists
    run: |
      if [ ! -f README.md ]; then
        echo "ERROR: README.md does not exist."
        exit 1
      fi

  - name: Check README is not empty
    run: |
      if [ ! -s README.md ]; then
        echo "ERROR: README.md is empty."
        exit 1
      fi

  - name: Check required documentation sections
    run: |
      required_sections=(
        "# Bangladesh Electricity Bill Calculator"
        "## Project Description"
        "## Programming Language and Framework"
        "## Installation"
        "## Build the Project"
        "## Running the Automated Tests"
        "# GitHub Actions Automation"
      )

      for section in "${required_sections[@]}"; do
        if ! grep -Fq "$section" README.md; then
          echo "ERROR: Missing required section: $section"
          exit 1
        fi
      done

      echo "README.md documentation check passed successfully."
```
